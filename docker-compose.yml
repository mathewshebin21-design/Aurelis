# Local development database. PostgreSQL 16 with pgvector (used from Phase 4).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aurelis
      POSTGRES_PASSWORD: aurelis-local-only
      POSTGRES_DB: aurelis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelis"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
